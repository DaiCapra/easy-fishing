[project]
name = "easyfishing-tests"
version = "0.0.0"
description = "Lua test harness for the EasyFishing addon (lupa + pytest)"
requires-python = ">=3.10"
dependencies = [
    "lupa",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-p no:cacheprovider"
